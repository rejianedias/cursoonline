{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>

  <meta charset="UTF-8">
  <title>{% block title %}Curso Online{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'blog/style.css' %}">
  <link rel="icon" href="{% static 'blog/favicon.ico' %}" type="image/x-icon">
</head>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const form = document.getElementById("comentario-form");
  if (form) {
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      const texto = document.getElementById("comentario-texto").value;
      const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

      const response = await fetch(window.location.href, {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
          "X-CSRFToken": csrfToken
        },
        body: new URLSearchParams({
          comentar: "true",
          comentario: texto
        })
      });

      if (response.ok) {
        window.location.hash = "#comentarios";
        location.reload();  // recarrega no mesmo ponto
      }
    });
  }
});
</script>

  <body>

<header class="navbar navbar-expand-lg custom-header shadow-sm">

    
    <a class="navbar-brand d-flex align-items-center gap-3" href="{% url 'home' %}">
    <img src="{% static 'blog/logo.jpg' %}" alt="Logo CursoOnline" width="300" height="100" class="rounded-circle">
    <span class="site-slogan">Transforme seu futuro com conhecimento gratuito</span>
  </a>
  <div class="ms-auto d-flex gap-3 align-items-center">
  <a href="{% url 'home' %}" class="top-menu">Início</a>

  {% if user.is_authenticated %}
    <a href="{% url 'profile' %}" class="top-menu">Perfil</a>

   <form id="logout-form" method="post" action="{% url 'logout' %}" style="display: none;">
  {% csrf_token %}
</form>

<a href="#" class="top-menu" onclick="document.getElementById('logout-form').submit(); return false;">Sair</a>



  {% else %}
    <a href="{% url 'login' %}" class="top-menu">Login</a>
    <a href="{% url 'signup' %}" class="top-menu">Cadastrar</a>
  {% endif %}
</div>

</header>


 <main class="container py-4 content">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-dark text-white text-center py-3 mt-5">
    <p>© 2025 - Cursoonline</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const favForm = document.getElementById("favoritar-form");
  if (favForm) {
    favForm.addEventListener("submit", async function (e) {
      e.preventDefault();
      const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

      const response = await fetch(window.location.href, {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
          "X-CSRFToken": csrfToken
        },
        body: new URLSearchParams({
          favoritar: "true"
        })
      });

      if (response.ok) {
        location.reload(); // Mantém na mesma posição
      }
    });
  }
});
</script>
